name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Check tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -Po 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "$tag" != "$version" ]; then echo "Tag $GITHUB_REF_NAME != versionName $version"; exit 1; fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:testGithubDebugUnitTest :app:assembleGithubRelease :app:assembleStoreRelease
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          # The self-updating APK keeps its old name and goes first: earlier versions update from the first APK
          # of a release. The store APK (no self-update) is named so that it also sorts after it.
          cp app/build/outputs/apk/github/release/app-github-release.apk "dist/LibriaTV-$version.apk"
          cp app/build/outputs/apk/store/release/app-store-release.apk "dist/LibriaTV-store-$version.apk"

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pick release notes
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then echo "NOTES=$notes" >> "$GITHUB_ENV"; fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: LibriaTV ${{ github.ref_name }}
          files: |
            dist/LibriaTV-${{ env.VERSION }}.apk
            dist/LibriaTV-store-${{ env.VERSION }}.apk
          body_path: ${{ env.NOTES }}
          generate_release_notes: ${{ env.NOTES == '' }}
